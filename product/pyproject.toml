[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "embat-finscore"
version = "0.1.0"
description = "HackSpain 2026 submission for Embat Track: company monetary health scores"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.12"
authors = [{ name = "eZWALT" }]
dependencies = []

[project.optional-dependencies]
dev = [
  "pytest>=8.0.0",
  "ruff>=0.6.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/embat_finscore"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "W"]
